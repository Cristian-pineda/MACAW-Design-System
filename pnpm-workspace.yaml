packages:
  - 'packages/*'
  - 'apps/*'
minimumReleaseAgeExclude:
  - lucide-react@1.55.0
  - prettier@3.9.10
  - rolldown-plugin-dts@0.28.7
  - style-dictionary@5.6.1
  - tsdown@0.23.1

peerDependencyRules:
  allowedVersions:
    'eslint-plugin-jsx-a11y>eslint': '10'

overrides:
  typescript: 5.9.3

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
