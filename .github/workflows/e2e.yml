name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update-baselines:
        description: Regenerate visual regression baselines and commit them
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Only the update-baselines job below asks for more, and only when
# dispatched by hand, so a pull request never runs with a token that can push.
permissions:
  contents: read

jobs:
  e2e:
    name: a11y, keyboard, visual
    if: ${{ !inputs.update-baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=docs...
      - name: Run Playwright
        run: pnpm test:e2e
        env:
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  update-baselines:
    name: update visual baselines
    # Dispatch this on a branch, then open a pull request; main is protected and rejects the push.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update-baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # commits the regenerated screenshots to the dispatched branch
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=docs...
      - name: Update baselines
        run: pnpm test:e2e --update-snapshots
        env:
          HOME: /root
      - name: Commit baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          git commit -m "test: update visual baselines" || echo "no changes"
          git push
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
