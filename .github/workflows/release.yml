name: release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          # The action runs this without a shell, so `&&` must live inside a package script.
          version-script: pnpm version-packages
          publish-script: pnpm release
          create-github-releases: true
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trusted publishing (OIDC) is used once the repo is public and each package has a trusted
          # publisher configured on npmjs.com. Until then, set NPM_TOKEN (granular, 90-day) as a bridge.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
